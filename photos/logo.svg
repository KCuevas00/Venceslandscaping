<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="420" height="120">
  <defs>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="subtleDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Emblem Icon on Left -->
  <g transform="translate(15, 10)">
    <!-- Shield / Badge Background -->
    <rect x="0" y="0" width="100" height="100" rx="22" fill="url(#greenGrad)" filter="url(#subtleDrop)"/>
    <rect x="2" y="2" width="96" height="96" rx="20" fill="none" stroke="#4ade80" stroke-width="1.5" stroke-opacity="0.4"/>
    
    <!-- Tree Trunk & Roots -->
    <path d="M50 78 L50 48" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M50 64 Q42 56 36 54" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M50 58 Q58 52 64 50" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M50 74 Q44 76 38 80" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M50 74 Q56 76 62 80" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Lush Foliage Canopy (Three Clouds/Leaves) -->
    <circle cx="50" cy="38" r="14" fill="#4ade80"/>
    <circle cx="38" cy="45" r="12" fill="#22c55e"/>
    <circle cx="62" cy="45" r="12" fill="#16a34a"/>
    <circle cx="50" cy="44" r="10" fill="#ffffff" fill-opacity="0.2"/>

    <!-- Rolling Lawn Striping Arc at Base -->
    <path d="M16 84 Q50 68 84 84" stroke="url(#amberGrad)" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Wordmark & Typography on Right -->
  <g transform="translate(132, 22)">
    <!-- Primary Brand Word -->
    <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" letter-spacing="-0.5px" fill="#0f172a">
      VENCES
    </text>
    <text x="160" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" letter-spacing="-0.5px" fill="#15803d">
      .
    </text>

    <!-- Secondary Tagline -->
    <text x="2" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" letter-spacing="3.5px" fill="#16a34a">
      LANDSCAPING LLC
    </text>

    <!-- Subtag / Specialties -->
    <text x="2" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" letter-spacing="1.2px" fill="#64748b">
      LAWN CARE &bull; MULCH &bull; HARDSCAPING
    </text>
  </g>
</svg>
